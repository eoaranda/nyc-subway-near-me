<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Subway">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)">
<title>subway</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%2300933C'/><text x='16' y='23' font-size='20' font-family='Helvetica' font-weight='bold' fill='white' text-anchor='middle'>6</text></svg>">

<style>
  :root {
    --bg: #0b0b0c;
    --card: #17181a;
    --line: #26282c;
    --ink: #f2f3f5;
    --dim: #8b9196;
    --soon: #6ee787;   /* a train you can still make */
    --tap: 46px;       /* never smaller than a thumb */
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f8; --card: #fff; --line: #e6e8ea;
      --ink: #14161a; --dim: #767c82; --soon: #0f7a37;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html { background: var(--bg); }
  body {
    margin: 0 auto;
    padding: max(10px, env(safe-area-inset-top)) 10px
             max(16px, env(safe-area-inset-bottom));
    max-width: 680px;
    background: transparent;
    color: var(--ink);
    position: relative;
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body > header {
    display: flex; align-items: baseline; gap: 10px; padding: 4px 4px 12px;
  }
  h1 { font-size: 14px; margin: 0; font-weight: 700;
       letter-spacing: .1em; text-transform: uppercase; }
  #status { color: var(--dim); font-size: 15px; margin: 0 0 0 auto;
            font-variant-numeric: tabular-nums; }
  #status[data-state="bad"] { color: #ff7b72; }

  /* ---- station card ---- */
  .station { background: var(--card); border: 1px solid var(--line);
             border-radius: 14px; padding: 12px 0 4px; margin-bottom: 12px; }
  .station > header {
    display: flex; align-items: baseline; gap: 8px;
    padding: 0 14px 10px; flex-wrap: wrap;
  }
  .station h2 { font-size: 19px; margin: 0; font-weight: 680;
                letter-spacing: -.01em; }
  .meta { color: var(--dim); font-size: 15px; margin: 0;
          font-variant-numeric: tabular-nums; }

  /* ---- route bullets ---- */
  .bullet {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%;
    color: #fff; font-size: 16px; font-weight: 700;
    font-family: Helvetica, Arial, sans-serif;
  }
  .bullet.express { border-radius: 4px; transform: rotate(45deg); }
  .bullet.express > span { transform: rotate(-45deg); }
  .bullet.on-yellow, .bullet.on-silver, .bullet.on-slate { color: #000; }

  /* ---- one line's departures ---- */
  .group { border-top: 1px solid var(--line); }
  .group:first-of-type { border-top: 0; }

  .departure {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr) repeat(3, 3.5em);
    align-items: center;
    column-gap: 10px;
    min-height: var(--tap);
    padding: 0 14px;
  }
  .departure + .departure { border-top: 1px solid var(--line); }

  .heading {
    font-size: 16px; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .t {
    font-size: 16px; text-align: right; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .t.catchable { color: var(--soon); font-weight: 650; }

  .empty { color: var(--dim); font-size: 15px; padding: 10px 14px; }

  /* ---- a tappable service row ---- */
  .line + .line { border-top: 1px solid var(--line); }
  .departure {
    grid-template-columns: 28px minmax(0, 1fr) repeat(3, 3.5em) 14px;
    width: 100%; background: transparent; border: 0; color: inherit;
    font: inherit; text-align: left; cursor: pointer;
    -webkit-appearance: none;
  }
  .departure:active { background: var(--line); }
  .chev {
    color: var(--dim); font-size: 19px; line-height: 1; text-align: right;
    transition: transform .15s ease;
  }
  .chev.open { transform: rotate(90deg); }

  /* ---- the stops that train still has to make ---- */
  .ahead { border-top: 1px dashed var(--line); }
  .caption {
    margin: 0; padding: 9px 14px 2px 52px;
    font-size: 12.5px; color: var(--dim);
    letter-spacing: .02em;
  }
  /* The stop list is drawn as a little transit map: a rail down the
     left with a dot per stop, ending in an arrow so the direction of
     travel is unmistakable. The rail sits under the route bullet
     above it -- 28px from the card edge, which is 14px of padding
     plus half of a 28px bullet. */
  .stops {
    list-style: none; margin: 0; padding: 0 14px 12px 52px;
    --dot: -27px;       /* puts a 6px dot's centre on the rail */
    --rail: -24.5px;    /* puts a 2px rail on the same centre */
    --tip: -28px;       /* puts an 8px arrowhead on the same centre */
  }
  .stops li {
    display: flex; align-items: baseline; gap: 10px;
    padding: 5px 0; font-size: 15px; color: var(--dim);
    position: relative;
  }
  /* the stop itself */
  .stops li::before {
    content: ""; position: absolute; left: var(--dot);
    top: 50%; transform: translateY(-50%);
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--dim); opacity: .5;
  }
  /* the rail joining this stop to the next */
  .stops li:not(:last-child)::after {
    content: ""; position: absolute; left: var(--rail);
    top: 50%; bottom: -50%; width: 2px;
    background: var(--dim); opacity: .3;
  }
  /* the end of the line */
  .stops li:last-child::before {
    left: var(--tip);
    width: 0; height: 0; border-radius: 0; background: none;
    opacity: .65;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 7px solid var(--dim);
  }
  .stops li > span:first-child {
    flex: 1; min-width: 0; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .stops .at { font-variant-numeric: tabular-nums; }
  .stops .quiet { color: var(--dim); font-style: italic; }

  /* ---- see more ---- */
  .more {
    display: block; width: calc(100% - 20px); margin: 6px 10px 8px;
    min-height: var(--tap);
    background: transparent; border: 1px solid var(--line);
    border-radius: 10px; color: var(--dim);
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .more:active { background: var(--line); }

  /* ---- the permission prompt ---- */
  #ask { text-align: center; padding: 48px 20px; }
  #ask p { color: var(--dim); font-size: 16px; max-width: 32ch;
           margin: 0 auto 22px; line-height: 1.45; }
  button#locate {
    font: inherit; font-size: 17px; font-weight: 600; color: #fff;
    background: #0039A6; border: 0; border-radius: 12px;
    padding: 0 26px; min-height: 52px; cursor: pointer;
  }
  button#locate:active { opacity: .8; }
  [hidden] { display: none !important; }

  /* ---- a quiet skyline behind everything ---- */
  .skyline {
    position: fixed; left: 0; right: 0; bottom: 0;
    width: 100%; height: auto;
    z-index: -1; pointer-events: none; user-select: none;
    color: var(--ink); opacity: .09;
  }
  @media (prefers-color-scheme: light) { .skyline { opacity: .11; } }

  /* ---- footer ---- */
  footer {
    padding: 14px 6px 4px; text-align: center;
    font-size: 12px; color: var(--dim);
  }
  footer a {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--dim); text-decoration: none;
  }
  footer a:hover { color: var(--ink); }
  footer svg { display: block; opacity: .85; }

  /* Big screens: two columns rather than one long ribbon of cards. */
  @media (min-width: 900px) {
    body { max-width: 1040px; }
    #board {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 14px; align-items: start;
    }
  }

  /* Phones: let the cards run to the edges, and give the times room. */
  @media (max-width: 430px) {
    body { padding-left: 6px; padding-right: 6px; font-size: 17px; }
    .station { border-radius: 12px; }
    .station > header, .departure, .empty { padding-inline: 12px; }
    .stops { padding-left: 48px; padding-right: 12px; }
    /* Fixed columns, not em: on a 320px phone the countdowns must not
       be allowed to squeeze "Downtown" into "Down...". */
    .departure { grid-template-columns: 26px minmax(0, 1fr) repeat(3, 42px) 12px;
                 column-gap: 6px; }
    .bullet { width: 26px; height: 26px; font-size: 15px; }
    .heading { font-size: 15px; }
    .t { font-size: 15px; }
    /* narrower bullet on a phone moves the rail to 25px */
    .caption, .stops { padding-left: 44px; }
    .stops { --dot: -22px; --rail: -20px; --tip: -23px; }
  }
</style>

<header>
  <h1>Nearest trains</h1>
  <p id="status">starting</p>
</header>

<div id="ask" hidden>
  <p>This page needs your location to find the stations nearest you. It is
     used in your browser only and never sent anywhere.</p>
  <button id="locate" type="button">Find my trains</button>
</div>
