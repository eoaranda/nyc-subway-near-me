<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>subway</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%2300933C'/><text x='16' y='23' font-size='20' font-family='Helvetica' font-weight='bold' fill='white' text-anchor='middle'>6</text></svg>">

<style>
  :root {
    --bg: #0b0b0c;
    --card: #17181a;
    --line: #26282c;
    --ink: #f2f3f5;
    --dim: #8b9196;
    --soon: #6ee787;   /* a train you can still make */
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f8; --card: #fff; --line: #e6e8ea;
      --ink: #14161a; --dim: #767c82; --soon: #0f7a37;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0 auto;
    padding: max(10px, env(safe-area-inset-top)) 12px
             max(12px, env(safe-area-inset-bottom));
    max-width: 560px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  body > header {
    display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px;
  }
  h1 { font-size: 13px; margin: 0; font-weight: 700;
       letter-spacing: .09em; text-transform: uppercase; }
  #status { color: var(--dim); font-size: 12px; margin: 0 0 0 auto;
            font-variant-numeric: tabular-nums; }
  #status[data-state="bad"] { color: #ff7b72; }

  /* ---- station card ---- */
  .station { background: var(--card); border: 1px solid var(--line);
             border-radius: 10px; padding: 9px 12px 4px; margin-bottom: 8px; }
  .station > header {
    display: flex; align-items: baseline; gap: 7px;
    padding-bottom: 7px; flex-wrap: wrap;
  }
  .station h2 { font-size: 15px; margin: 0; font-weight: 650; }
  .meta { color: var(--dim); font-size: 12px; margin: 0;
          font-variant-numeric: tabular-nums; }

  /* ---- route bullets ---- */
  .bullet {
    display: inline-flex; align-items: center; justify-content: center;
    width: 21px; height: 21px; border-radius: 50%;
    color: #fff; font-size: 12px; font-weight: 700;
    font-family: Helvetica, Arial, sans-serif;
  }
  .bullet.express { border-radius: 3px; transform: rotate(45deg); }
  .bullet.express > span { transform: rotate(-45deg); }
  .bullet.on-yellow, .bullet.on-silver, .bullet.on-slate { color: #000; }

  /* ---- departures ----
     One grid row per service, three fixed countdown columns, so the
     times line up down the card the way rjust(5) lines them up in the
     terminal. */
  .departure {
    display: grid;
    grid-template-columns: 21px minmax(0, 1fr) repeat(3, 3.3em);
    align-items: center;
    column-gap: 8px;
    padding: 3px 0;
    border-top: 1px solid var(--line);
  }
  .heading {
    font-size: 13.5px; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .t {
    font-size: 13.5px; text-align: right; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .t.catchable { color: var(--soon); font-weight: 600; }
  .empty { color: var(--dim); font-size: 13px; padding: 4px 0;
           border-top: 1px solid var(--line); }

  /* ---- the permission prompt ---- */
  #ask { text-align: center; padding: 40px 16px; }
  #ask p { color: var(--dim); font-size: 13.5px; max-width: 34ch;
           margin: 0 auto 18px; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: #0039A6;
    border: 0; border-radius: 9px; padding: 10px 20px; cursor: pointer;
  }
  button:active { opacity: .8; }
  [hidden] { display: none !important; }
</style>

<header>
  <h1>Nearest trains</h1>
  <p id="status">starting</p>
</header>

<div id="ask" hidden>
  <p>This page needs your location to find the stations nearest you. It is
     used in your browser only and never sent anywhere.</p>
  <button id="locate" type="button">Find my trains</button>
</div>

<main id="board"></main>

<script type="module" src="./app.js"></script>
